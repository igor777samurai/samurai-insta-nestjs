apiVersion: apps/v1
kind: Deployment
metadata:
  name: DEPLOYMENT_NAME
  namespace: NAMESPACE
  labels:
    app: PROJECT
spec:
  selector:
    matchLabels:
      project: PROJECT
  template:
    metadata:
      namespace: NAMESPACE
      labels:
        project: PROJECT
    spec:
      containers:
        - name: PROJECT
          image: REGISTRY_HOSTNAME/PROJECT:TAG_VERSION
          securityContext:
            allowPrivilegeEscalation: false
            runAsNonRoot: true      # опционально, но хорошая практика
            runAsUser: 1000         # опционально
          ports:
            - containerPort: PORT_CONTAINER
          env:
            - name: AUTH_SERVICE_HOST
              valueFrom:
                secretKeyRef:
                  name: api-auth-production-config-secret
                  key: AUTH_SERVICE_HOST
            - name: AUTH_SERVICE_PORT
              valueFrom:
                secretKeyRef:
                  name: api-auth-production-config-secret
                  key: AUTH_SERVICE_PORT
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: api-auth-production-config-secret
                  key: DATABASE_URL
            - name: DIRECT_URL
              valueFrom:
                secretKeyRef:
                  name: api-auth-production-config-secret
                  key: DIRECT_URL
            - name: JWT_ACCESS_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-auth-production-config-secret
                  key: JWT_ACCESS_SECRET
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: api-auth-production-config-secret
                  key: JWT_SECRET
